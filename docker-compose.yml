# Local MySQL 8.4 for development or production-like testing.
#   docker compose up -d
#   backend/.env: DB_HOST=127.0.0.1 DB_PORT=3307 DB_DATABASE=ppc_leads DB_USERNAME=root DB_PASSWORD=root
#   cd backend && php artisan migrate --seed
# Published on 3307 so it doesn't clash with a XAMPP/MySQL install on 3306.
services:
  mysql:
    image: mysql:8.4
    container_name: ppc-leads-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ppc_leads
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Keep the Lead indexes in memory; production: ~50-70% of the server's RAM
      - --innodb-buffer-pool-size=1G
    ports:
      - "3307:3306"
    volumes:
      - ppc_mysql_data:/var/lib/mysql

volumes:
  ppc_mysql_data:
