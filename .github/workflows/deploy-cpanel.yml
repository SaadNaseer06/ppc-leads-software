name: Deploy to cPanel

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: cpanel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Pull & deploy on cPanel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          CPANEL_APP_DIR: ${{ secrets.CPANEL_APP_DIR }}
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 10m
          envs: CPANEL_APP_DIR
          script: |
            set -e
            APP_DIR="${CPANEL_APP_DIR:-$HOME/public_html/ppcleads.serverlinktestwebsites.com}"
            cd "$APP_DIR"

            echo "==> git pull"
            git fetch origin master
            git reset --hard origin/master

            echo "==> composer + packages (cpanel-install.sh)"
            bash scripts/cpanel-install.sh

            echo "==> deploy done"
